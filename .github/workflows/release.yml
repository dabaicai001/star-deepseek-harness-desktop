name: Release desktop bundles

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows / x86_64
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache-dependency-path: sidecar/go.sum

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Install frontend dependencies
        run: npm ci

      - name: Install dsh runtime dependencies
        run: pnpm --dir vendor/deepseek-harness install --frozen-lockfile

      - name: Test frontend and Go sidecar
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location sidecar
          go test ./...
          $testExit = $LASTEXITCODE
          Pop-Location
          exit $testExit

      - name: Build release sidecar
        run: npm run sidecar:build:release

      - name: Build embed resources
        run: npm run build:embed

      - name: Package dsh runtime
        run: npm run package:dsh-runtime

      - name: Test Tauri backend
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build Windows installer
        run: npx tauri build --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: starhub-windows-x86_64-${{ github.ref_name }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    name: Linux / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            runner: ubuntu-22.04
            deb_arch: amd64
          - name: ARM64
            runner: ubuntu-22.04-arm
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          # ARM64 runners fetch from ports.ubuntu.com which is prone to
          # transient timeouts; configure apt retries and loop the install.
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo apt-get update
          for i in 1 2 3; do
            sudo apt-get install --no-install-recommends -y \
              build-essential \
              cpio \
              file \
              libayatana-appindicator3-dev \
              libgtk-3-dev \
              librsvg2-dev \
              libsqlite3-dev \
              libssl-dev \
              libwebkit2gtk-4.1-dev \
              libxdo-dev \
              patchelf \
              pkg-config \
              rpm && break
            echo "apt-get install attempt $i failed, retrying in 10s..."
            sleep 10
            sudo apt-get update
          done
          # Verify the critical package installed; fail loudly if not.
          dpkg -s libwebkit2gtk-4.1-dev >/dev/null 2>&1 || { echo "ERROR: libwebkit2gtk-4.1-dev not installed"; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache-dependency-path: sidecar/go.sum

      - name: Set up Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Install frontend dependencies
        run: npm ci

      - name: Install dsh runtime dependencies
        run: pnpm --dir vendor/deepseek-harness install --frozen-lockfile

      - name: Test frontend and Go sidecar
        run: |
          npm run build
          (cd sidecar && go test ./...)

      - name: Build release sidecar
        run: npm run sidecar:build:release

      - name: Build embed resources
        run: npm run build:embed

      - name: Package dsh runtime
        run: npm run package:dsh-runtime

      - name: Test Tauri backend
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build Linux desktop bundles
        run: npx tauri build --bundles deb,rpm,appimage

      - name: Audit packages, sidecar and shared libraries
        run: bash scripts/verify-linux-bundles.sh src-tauri/target/release/bundle "${{ matrix.deb_arch }}"

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: starhub-linux-${{ matrix.name }}-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [windows, linux]
    runs-on: ubuntu-22.04

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: starhub-*-${{ github.ref_name }}
          path: release-artifacts
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: StarHub ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.deb
            release-artifacts/**/*.rpm
            release-artifacts/**/*.AppImage
