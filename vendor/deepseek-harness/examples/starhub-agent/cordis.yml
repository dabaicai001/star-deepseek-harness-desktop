# StarHub AI 工作区(内嵌 AI 助手)专用组合(内核替换 P1-3 起)。
# 安全边界:不挂 bash/fs 工具——StarHub 的资产工具经 starhub-tools 插件接入,
# 审批语义走 ctx.approval 桥(方案 5.2):审批策略由 dsh 权限 preset 供给
# (设置 → 通用 → 权限,共享 settings.yaml);starhub-approval-bridge 只做
# preset 消费 + 风险门(防误删:starhub 域工具唯一的 ask 来源)+ 确认卡应答桥。
# stdout 只走 JSON-RPC;不要加 console logger。

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: !!js "process.env.DSH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.DSH_MAX_TOKENS_AS_SUCCESS)"

# 与 dsh web GUI 共享的用户设置文档(权限默认 preset 等);路径由 Rust 桥注入,
# 与 web 运行时(harness/web.rs 的 $DSH_HOME = <app_data_dir>/dsh-web-home)同一份。
- id: settings
  name: '@deepseek-ai/dsh-settings-file'
  config:
    path: !!js "process.env.DSH_SETTINGS_PATH ?? './.settings.yaml'"

# 审批服务(策略 + 审计对);answerer 由 starhub-approval-bridge 桥到宿主确认卡。
- id: approval
  name: '@deepseek-ai/dsh-user-approval'

# DeepSeek 适配器(OpenAI 兼容端点经 DEEPSEEK_BASE_URL 注入);模型随 initialize 按会话传入。
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are StarHub AI, an operations assistant embedded in the StarHub desktop app.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    # StarHub Rust 桥默认注入应用数据目录;缺省 ./.sessions 仅限独立调试。
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

# 子代理(P1-5:Planner→Executor 由 dsh subagent 承接;plan mode 依赖
# user-questions 审批缝,待审批桥落地后再启用)
- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# StarHub 宿主工具(P1-4):list_capabilities / list_assets / session_search /
# memory;执行经 sdk-jsonrpc-server 暴露的 sdk-transport(本地补丁)桥回 Rust
# 主进程,工具体不在 dsh 进程内。必须排在 sdk-jsonrpc-server 之后加载。
- id: starhub-tools
  name: '@deepseek-ai/dsh-starhub-tools'

# 审批桥(Phase 2;2026-08-17 瘦身改名):消费共享 settings.yaml 的
# permission preset(策略本体在 dsh 侧)+ starhub_* 工具风险门 +
# approval/request 应答桥(前端确认卡)。
# 必须排在 sdk-jsonrpc-server / settings / approval 之后。
- id: starhub-approval-bridge
  name: '@deepseek-ai/dsh-starhub-approval-bridge'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
