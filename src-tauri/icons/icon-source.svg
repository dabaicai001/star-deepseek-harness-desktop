  <ellipse cx="512" cy="512" rx="332" ry="118" transform="rotate(-31 512 512)" fill="none" stroke="#f3f8fc" stroke-opacity=".62" stroke-width="10" stroke-dasharray="210 980" stroke-linecap="round"/>

